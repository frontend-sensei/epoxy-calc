<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090a">
    <title>Калькулятор смолы</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd98a'/%3E%3Cstop offset='1' stop-color='%23b8681a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 3C16 3 6 14.5 6 20.5a10 10 0 0 0 20 0C26 14.5 16 3 16 3z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="top">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            Калькулятор смолы
        </div>
        <button type="button" class="saved-open" id="savedOpen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z" /></svg>
            Мои
            <span class="badge" id="savedCount" hidden></span>
        </button>
    </header>

    <div class="shape-switch" role="radiogroup" aria-label="Форма">
        <button type="button" class="shape-card selected" data-shape="rect" role="radio" aria-checked="true">
            <svg viewBox="0 0 48 36" aria-hidden="true">
                <path d="M24 4 44 14 24 24 4 14Z" />
                <path d="M4 14v8l20 10 20-10v-8M24 24v8" />
            </svg>
            Прямоугольная
        </button>
        <button type="button" class="shape-card" data-shape="circle" role="radio" aria-checked="false">
            <svg viewBox="0 0 48 36" aria-hidden="true">
                <ellipse cx="24" cy="12" rx="19" ry="8" />
                <path d="M5 12v11c0 4.4 8.5 8 19 8s19-3.6 19-8V12" />
            </svg>
            Круглая
        </button>
    </div>

    <form id="formInputs" autocomplete="off">
        <div id="rectFields" class="row row-3">
            <label class="field">
                <span class="field-name">Длина</span>
                <span class="field-box">
                    <input type="number" id="rectLength" min="0.1" step="0.1" value="10" inputmode="decimal" enterkeyhint="next" required>
                    <span class="unit">см</span>
                </span>
            </label>
            <label class="field">
                <span class="field-name">Ширина</span>
                <span class="field-box">
                    <input type="number" id="rectWidth" min="0.1" step="0.1" value="10" inputmode="decimal" enterkeyhint="next" required>
                    <span class="unit">см</span>
                </span>
            </label>
            <label class="field">
                <span class="field-name">Высота</span>
                <span class="field-box">
                    <input type="number" id="rectHeight" min="0.1" step="0.1" value="1" inputmode="decimal" enterkeyhint="next" required>
                    <span class="unit">см</span>
                </span>
            </label>
        </div>
        <div id="circleFields" class="row row-2" hidden>
            <label class="field">
                <span class="field-name">Диаметр</span>
                <span class="field-box">
                    <input type="number" id="circleDiameter" min="0.1" step="0.1" value="10" inputmode="decimal" enterkeyhint="next" required>
                    <span class="unit">см</span>
                </span>
            </label>
            <label class="field">
                <span class="field-name">Высота</span>
                <span class="field-box">
                    <input type="number" id="circleHeight" min="0.1" step="0.1" value="1" inputmode="decimal" enterkeyhint="next" required>
                    <span class="unit">см</span>
                </span>
            </label>
        </div>

        <div class="field-name ratio-title">Пропорция смешивания (A : B)</div>
        <div class="ratio">
            <span class="field-box">
                <input type="number" id="partA" min="1" value="100" inputmode="decimal" enterkeyhint="next" aria-label="Компонент A, частей" required>
            </span>
            <span class="ratio-sep" aria-hidden="true">:</span>
            <span class="field-box">
                <input type="number" id="partB" min="1" value="60" inputmode="decimal" enterkeyhint="done" aria-label="Компонент B, частей" required>
            </span>
        </div>
    </form>

    <section class="result" aria-live="polite">
        <svg id="vizSvg" class="viz" viewBox="0 0 440 230" role="img" aria-label="Форма с заливкой"></svg>

        <div class="result-row">
            <span class="result-name"><i class="dot dot-a"></i>Компонент A</span>
            <span class="result-value result-a"><b id="amountA">0</b> г</span>
        </div>
        <div class="result-row">
            <span class="result-name"><i class="dot dot-b"></i>Компонент B</span>
            <span class="result-value result-b"><b id="amountB">0</b> г</span>
        </div>
        <div class="result-total">
            <span>Масса смеси</span>
            <span><b id="totalMass">0</b> г · <span id="totalMassKg">0</span> кг</span>
        </div>
    </section>
</div>

<dialog class="sheet" id="savedSheet" aria-labelledby="savedTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
        <h2 id="savedTitle">Мои расчёты</h2>
        <button type="button" class="sheet-close" id="savedClose" aria-label="Закрыть">×</button>
    </div>
    <form class="save-form" id="saveForm" autocomplete="off">
        <span class="field-box">
            <input type="text" id="saveName" maxlength="60" placeholder="Название, например «Столешница»" enterkeyhint="done">
        </span>
        <button type="submit" class="btn-primary">Сохранить текущий</button>
    </form>
    <ul class="saved-list" id="savedList"></ul>
    <p class="saved-empty" id="savedEmpty">Пока пусто. Введите название и нажмите «Сохранить текущий».</p>
</dialog>

<script src="script.js"></script>
</body>
</html>
